<section class="editor-section" aria-labelledby="certificates-heading">
  <div class="editor-section__head">
    <h2 id="certificates-heading" class="h5 mb-0">Certificates</h2>
    <button class="btn btn-outline-primary btn-sm" type="button" (click)="addCertificate()">Add certificate</button>
  </div>
  <div class="editor-section__items">
    @for (certificate of certificates; track $index) {
      <app-editor-item
        [heading]="heading(certificate)"
        [meta]="meta(certificate)"
        [open]="openIndex() === $index"
        (openChange)="setOpen($index, $event)"
      >
        <div class="row g-3 pt-3 align-items-end">
          <label class="col-12 col-md-5">
            Name
            <input class="form-control" [value]="certificate.Name ?? ''" (input)="updateName($index, $event)" />
          </label>
          <label class="col-12 col-md-5">
            Issuer
            <input class="form-control" [value]="certificate.Issuer ?? ''" (input)="updateIssuer($index, $event)" />
          </label>
          <label class="col-12 col-md-2">
            Year
            <input class="form-control" type="number" step="1" [value]="certificate.Year ?? ''" (input)="updateYear($index, $event)" />
          </label>
          <div class="col-12">
            <button class="btn btn-outline-danger btn-sm" type="button" (click)="removeCertificate($index)">Remove this certificate</button>
          </div>
        </div>
      </app-editor-item>
    } @empty {
      <p class="text-body-secondary mb-0">No certificates added.</p>
    }
  </div>
</section>
