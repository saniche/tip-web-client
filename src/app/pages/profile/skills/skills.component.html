<details class="card p-3 mb-3" open>
  <summary class="mb-3">
    <h2 id="skills-heading" class="h5 d-inline mb-0">Skills</h2>
  </summary>
  <div class="d-flex align-items-center justify-content-between gap-2 mb-3">
    <button class="btn btn-outline-primary btn-sm" type="button" (click)="addSkill()">Add skill</button>
  </div>
  @for (skill of skills; track $index) {
    <div class="row g-3 align-items-end mb-3">
      <label class="col-12 col-md-5">
        Name
        <input class="form-control" [value]="skillName(skill)" (input)="updateName($index, $event)" />
      </label>
      <label class="col-12 col-md-5">
        Level
        <select class="form-select" (change)="updateLevel($index, $event)">
          <option value="" [selected]="skillLevel(skill) === ''">Not specified</option>
          @for (level of levels; track level) {
            <option [value]="level" [selected]="skillLevel(skill) === level">{{ level }}</option>
          }
        </select>
      </label>
      <div class="col-12 col-md-2">
        <button class="btn btn-outline-danger w-100" type="button" (click)="removeSkill($index)">Remove</button>
      </div>
    </div>
  } @empty {
    <p class="text-body-secondary mb-0">No skills added.</p>
  }
</details>
