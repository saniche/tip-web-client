<section class="auth-card mx-auto">
  <div class="auth-card__intro">
    <p class="auth-kicker">API authentication</p>
    <h1>Start an authenticated session.</h1>
    <p>Use this form as the entry point for the backend login flow.</p>
  </div>

  <form class="row g-3" [formGroup]="form" (ngSubmit)="submit()">
    <label class="col-12">
      Email
      <input class="form-control" type="email" formControlName="email" placeholder="name@example.com" />
    </label>

    <label class="col-12">
      Password
      <input class="form-control" type="password" formControlName="password" placeholder="••••••••" />
    </label>

    <div class="col-12">
      <button class="btn btn-primary w-100" type="submit">Authenticate</button>
    </div>
  </form>

  <section class="auth-status" aria-label="Current session">
    <strong>{{ isAuthenticated() ? 'Authenticated' : 'Awaiting login' }}</strong>
    <p>{{ auth().email }}</p>
  </section>
</section>
